name: nepal_administrative_map
description: A comprehensive, interactive, and data-driven mapping package for Nepal, covering all 7 Provinces, 77 Districts, and 777 Local Levels.
version: 0.0.1
homepage: https://github.com/4bhisheksharma/nepal_administrative_map

environment:
  sdk: ^3.13.3
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0 
  
flutter:
  assets:
    - assets/maps/nepal/
    - assets/maps/provinces/koshi/
    - assets/maps/provinces/madhesh/
    - assets/maps/provinces/bagmati/
    - assets/maps/provinces/gandaki/
    - assets/maps/provinces/lumbini/
    - assets/maps/provinces/karnali/
    - assets/maps/provinces/sudurpashchim/
