name: nepal_administrative_map
description: A comprehensive, interactive, and data-driven mapping package for Nepal, covering all 7 provinces, 77 districts and 753 local levels, in English and Nepali.
version: 0.1.0
homepage: https://github.com/4bhisheksharma/nepal_administrative_map
repository: https://github.com/4bhisheksharma/nepal_administrative_map
issue_tracker: https://github.com/4bhisheksharma/nepal_administrative_map/issues
topics: [map, nepal, geography, i18n, visualization]

screenshots:
  - description: District map with Kaski selected.
    path: doc/screenshots/districts.png
  - description: All 753 local levels in dark mode.
    path: doc/screenshots/local_levels_dark.png

environment:
  sdk: ^3.13.3
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  leak_tracker_flutter_testing: any # version pinned by flutter_test

flutter:
  assets:
    # Generated by tool/build_data.dart. Boundary data: OKNP, CC BY 4.0.
    - assets/maps/nepal.topo.json
