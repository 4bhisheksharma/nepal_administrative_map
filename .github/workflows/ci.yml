name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool example/lib example/test
      - run: flutter analyze
      # Goldens depend on the OS's anti-aliasing; run them locally instead.
      - run: flutter test --exclude-tags golden
      - name: Example app
        working-directory: example
        run: |
          flutter pub get
          flutter test
      - name: Generated data is up to date
        run: |
          dart run tool/build_data.dart
          git diff --exit-code assets lib
